name: Flutter Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Static analysis and testing
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Format code
        run: dart format --set-exit-if-changed .
      - name: Run tests
        run: flutter test

  # Android build (APK and AAB)
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '10606108'
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (debug)
        run: flutter build apk --debug
      - name: Build AAB (release)
        run: |
          flutter build appbundle --release \
            --dart-define=INATURALIST_API_KEY=${{ secrets.INATURALIST_API_KEY || '' }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 7
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-*.aab
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: build/test-results.xml
          retention-days: 3

  # iOS build (IPA)
  ios-build:
    name: iOS Build
    runs-on: macos-14
    needs: analyze
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Install dependencies
        run: flutter pub get
      - name: Install CocoaPods
        run: pod install --repo-update
      - name: Build IPA (release)
        run: |
          flutter build ipa --release \
            --dart-define=INATURALIST_API_KEY=${{ secrets.INATURALIST_API_KEY || '' }}
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsym
          path: build/ios/ipa/*.dSYM
          retention-days: 7
      - name: Upload Flutter framework dSYM
        uses: actions/upload-artifact@v4
        with:
          name: ios-flutter-dsym
          path: build/ios/flutter/**/flutter.framework.dSYM
          retention-days: 7

  # Package delivery (Android)
  android-delivery:
    name: Android Package Delivery
    runs-on: ubuntu-latest
    needs: android-build
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '10606108'
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Build AAB (release)
        run: flutter build appbundle --release
      - name: Upload to Artifact Store
        uses: actions/upload-artifact@v4
        with:
          name: final-android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Package delivery (iOS)
  ios-delivery:
    name: iOS Package Delivery
    runs-on: macos-14
    needs: ios-build
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Install dependencies
        run: flutter pub get
      - name: Install CocoaPods
        run: pod install --repo-update
      - name: Build IPA (release)
        run: |
          flutter build ipa --release --dart-define=INATURALIST_API_KEY=${{ secrets.INATURALIST_API_KEY || '' }}
      - name: Upload to Artifact Store
        uses: actions/upload-artifact@v4
        with:
          name: final-ios-builds
          path: build/ios/ipa/*.ipa
          retention-days: 30
name: Flutter Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'
  PROJECT_NAME: critter_collect
  ORG: com.vetlove
  # Ключ iNaturalist необязателен: без него API работает с пониженным rate-limit.
  INATURALIST_KEY: ${{ secrets.INATURALIST_API_KEY }}

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --no-fatal-infos: поднимаем падение только на ошибки и предупреждения,
      # stylistic-подсказки (info) пока не блокируют сборку.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests
        run: flutter test

  android:
    name: Android Package
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 не используется: экшен падает на
      # `sdkmanager tools` (пакет удалён из репозитория SDK). На образе
      # ubuntu-latest Android SDK уже установлен, недостающие компоненты
      # Gradle докачивает сам.

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Каталогов android/ в репозитории нет — генерируем их на лету.
      # pubspec.yaml предварительно сохраняем: flutter create его перезаписывает.
      - name: Generate Android project
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create \
            --platforms=android \
            --project-name "$PROJECT_NAME" \
            --org "$ORG" \
            .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -f test/widget_test.dart

      # firebase_auth/geolocator требуют minSdk 23, а шаблон ставит
      # flutter.minSdkVersion (21 на Flutter 3.24).
      #
      # AGP 8.1 из шаблона Flutter 3.24 содержит D8, который падает с
      # NullPointerException на актуальных jar'ах (error_prone_annotations,
      # androidx.camera). Поднимаем AGP до 8.5.2 и Gradle до 8.7.
      - name: Tune Android Gradle
        run: |
          sed -i \
            -e 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' \
            -e 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' \
            android/app/build.gradle

          sed -i \
            -e 's/id "com.android.application" version "[0-9.]*"/id "com.android.application" version "8.5.2"/' \
            -e 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' \
            android/settings.gradle

          sed -i 's|gradle-[0-9.]*-all\.zip|gradle-8.7-all.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -rnE 'minSdk|com.android.application|distributionUrl' \
            android/app/build.gradle android/settings.gradle \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --dart-define=INATURALIST_API_KEY="$INATURALIST_KEY"

      # Пути с префиксом app/: defaults.run.working-directory не действует на
      # шаги uses:, upload-artifact выполняется от корня репозитория.
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app/build/app/outputs/bundle/release/*.aab
          retention-days: 30

  ios:
    name: iOS Package
    needs: analyze
    # Сборка .ipa требует сертификатов Apple, которых в secrets нет,
    # поэтому собираем неподписанный .app бандл.
    # macos-15 нужен из-за Xcode 16: FirebaseSharedSwift использует
    # модификатор `sending` из Swift 6, на Xcode 15 (macos-14) не компилируется.
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate iOS project
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create \
            --platforms=ios \
            --project-name "$PROJECT_NAME" \
            --org "$ORG" \
            .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -f test/widget_test.dart

      # Часть плагинов (sign_in_with_apple, firebase_* ) требует iOS 13+,
      # шаблон Flutter 3.24 выставляет 12.0 — иначе CocoaPods падает.
      - name: Set iOS deployment target
        run: |
          sed -i '' \
            -e 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' \
            -e 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' \
            ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Podfile ]; then
            sed -i '' \
              -e "s/^# platform :ios, '13.0'/platform :ios, '15.0'/" \
              -e "s/^platform :ios, '12.0'/platform :ios, '15.0'/" \
              ios/Podfile
          fi

      - name: Install dependencies
        run: flutter pub get

      # Плагины камеры и геолокации требуют usage-description в Info.plist;
      # без них сборка проходит, но приложение упадёт при запуске.
      - name: Add usage descriptions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Камера для AR-поиска животных'" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Поиск трейдов поблизости'" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Загрузка фото для распознавания'" ios/Runner/Info.plist || true

      # Сборка под симулятор: подпись не требуется вовсе, поэтому результат
      # не зависит от наличия Apple Developer аккаунта.
      # Flutter не поддерживает release для симулятора, поэтому --debug.
      - name: Build .app for simulator
        run: |
          flutter build ios --simulator --debug \
            --dart-define=INATURALIST_API_KEY="$INATURALIST_KEY"
          ls -d build/ios/iphonesimulator/*.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app/build/ios/iphonesimulator/*.app
          retention-days: 30
